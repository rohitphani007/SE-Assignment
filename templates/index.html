<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fake News Detection and Verification System</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 750px; margin: 40px auto; padding: 0 15px; }
        textarea { width: 100%; height: 200px; padding: 10px; font-size: 15px; }
        button { padding: 10px 22px; font-size: 15px; margin-top: 10px; cursor: pointer; }
        #result { margin-top: 25px; }
        .box { border: 1px solid #999; padding: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Fake News Detection and Verification System</h2>
    <p>Paste a news headline and article text below.</p>
    <textarea id="newsText" placeholder="Paste news article here..."></textarea><br>
    <button onclick="checkNews()">Check News</button>
    <div id="result"></div>

    <script>
        async function checkNews() {
            const text = document.getElementById("newsText").value;
            const out = document.getElementById("result");
            out.innerHTML = "Checking...";

            const res = await fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: text })
            });
            const data = await res.json();

            if (data.error) { out.innerHTML = data.error; return; }

            let html = "<div class='box'><b>Prediction: " + data.label + "</b><br>" +
                       "Confidence: " + data.confidence + "%<br>" +
                       "Key words that influenced the result: " + data.key_words.join(", ") + "</div>";

            html += "<div class='box'><b>Fact-check results</b><br>";
            if (!data.factcheck_enabled) {
                html += "Fact-check API key not set.";
            } else if (data.fact_checks.length === 0) {
                html += "No matching fact-checks found. This does not mean the news is true.";
            } else {
                data.fact_checks.forEach(f => {
                    html += "<p>" + f.claim + "<br>Rating: " + f.rating + " (" + f.publisher +
                            ") - <a href='" + f.url + "' target='_blank'>read</a></p>";
                });
            }
            html += "</div>";
            out.innerHTML = html;
        }
    </script>
</body>
</html>
